org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=true
# Suppress AGP warning for compileSdk=36 (build succeeds despite the warning)
android.suppressUnsupportedCompileSdk=36
# FLAG_SECURE on every activity: screenshots, recents, and most screen recordings stay black.
uci.preventScreenshots=true
